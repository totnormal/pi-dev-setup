<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deco Slides</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Instrument+Serif:ital@0;1&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Commit Mono', 'ui-monospace', 'monospace'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
          },
          colors: {
            'primary-light': '#D0EC1A',
            'primary-dark': '#07401A',
            'purple-light': '#A595FF',
            'purple-dark': '#151042',
            'yellow-light': '#FFC116',
            'yellow-dark': '#392B02',
            dc: {
              50:  '#FAFAF9',
              100: '#F1F0EE',
              200: '#E7E5E4',
              300: '#D6D3D1',
              400: '#A6A09D',
              500: '#78726E',
              600: '#56524E',
              700: '#44403C',
              800: '#282524',
              900: '#1C1917',
              950: '#121110',
            },
          },
        },
      },
    }
  </script>

  <!-- Import map for Preact + htm (zero-build JSX alternative) -->
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.25.4",
      "preact/hooks": "https://esm.sh/preact@10.25.4/hooks",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>

  <style>
    html, body, #root {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp';
      font-weight: normal; font-style: normal;
      display: inline-block; white-space: nowrap;
      direction: ltr; font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    @keyframes wave-hand {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    .animate-item {
      opacity: 0; transform: translateY(12px);
    }
    .animate-item.animated {
      opacity: 1; transform: translateY(0);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
