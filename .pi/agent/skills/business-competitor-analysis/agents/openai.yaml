interface:
  display_name: "Competitor Analysis"
  short_description: "Perform comprehensive competitor analysis for any business. Produces an executive-summary markdown report with target customer profile, market positioning, pricing/business model, product features, funding/company size, SWOT analysis, and competitive matrix. All findings are data-grounded. Use when the user asks to analyze competitors, understand competitive landscape, compare a business to alternatives, or perform market research."
  default_prompt: "Use the competitor-analysis skill. Follow the workflows and templates in SKILL.md. Ask minimal clarifying questions and produce structured outputs."
